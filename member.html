<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小家族基金 · 成員查詢</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .profit-green { color: #16a34a; }
        .loss-red { color: #dc2626; }
    </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen pb-12">
    <nav class="bg-indigo-800 text-white p-4 shadow-md">
        <div class="max-w-lg mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold">小家族基金 · 成員查詢</h1>
            <span class="text-xs text-indigo-200">只讀 · 僅可查看自己資料</span>
        </div>
    </nav>

    <div class="max-w-lg mx-auto mt-8 px-4 space-y-6">
        <!-- 登入區 -->
        <div id="loginBox" class="bg-white p-6 rounded-lg shadow-md">
            <h2 class="text-xl font-bold text-gray-800 mb-1">登入查看</h2>
            <p class="text-sm text-gray-500 mb-4">請選擇自己的名字並輸入 PIN。你只會看到自己的資料。</p>
            <div class="space-y-3">
                <label class="block">
                    <span class="text-gray-700 text-sm">成員名稱</span>
                    <select id="portalMember" class="mt-1 block w-full rounded-md border p-2">
                        <option value="">請選擇...</option>
                    </select>
                </label>
                <label class="block">
                    <span class="text-gray-700 text-sm">存取 PIN</span>
                    <input type="password" id="portalPin" class="mt-1 block w-full rounded-md border p-2" placeholder="輸入你的 PIN" autocomplete="current-password">
                </label>
                <button onclick="loginPortal()" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded hover:bg-indigo-700">
                    登入查看
                </button>
                <p id="portalError" class="text-red-500 text-sm hidden"></p>
            </div>
        </div>

        <!-- 登入後內容 -->
        <div id="portalContent" class="hidden space-y-6">
            <div class="bg-white p-4 rounded-lg shadow-md flex justify-between items-center">
                <div>
                    <h2 class="text-xl font-bold" id="portalName">成員</h2>
                    <p class="text-sm text-gray-500">個人資產與派息紀錄</p>
                </div>
                <button onclick="logoutPortal()" class="text-sm bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded">登出</button>
            </div>

            <div class="grid grid-cols-1 gap-4">
                <div class="bg-gradient-to-br from-blue-500 to-blue-700 p-6 rounded-lg shadow-md text-white">
                    <p class="text-blue-100 text-sm">我的投入本金</p>
                    <h3 class="text-3xl font-bold mt-2" id="portalCapital">$0.00</h3>
                </div>
                <div class="bg-gradient-to-br from-purple-500 to-purple-700 p-6 rounded-lg shadow-md text-white">
                    <p class="text-purple-100 text-sm">權益佔比</p>
                    <h3 class="text-3xl font-bold mt-2" id="portalEquity">0.00%</h3>
                </div>
                <div class="bg-gradient-to-br from-amber-500 to-orange-600 p-6 rounded-lg shadow-md text-white">
                    <p class="text-amber-100 text-sm">現時總價值（退出時可參考）</p>
                    <h3 class="text-3xl font-bold mt-2" id="portalCurrentValue">$0.00</h3>
                    <p class="text-xs text-amber-100 mt-2" id="portalValueRule">本金 + 已派利息 $0</p>
                </div>
            </div>

            <div class="bg-white p-4 rounded-lg shadow-md overflow-x-auto">
                <h3 class="text-lg font-bold mb-4">我的每月派息紀錄</h3>
                <table class="w-full text-sm text-left">
                    <thead class="bg-gray-50 text-gray-600">
                        <tr>
                            <th class="p-2">月份</th>
                            <th class="p-2 text-right">建議金額</th>
                            <th class="p-2 text-right">實際收到</th>
                            <th class="p-2 text-right">年化利率</th>
                            <th class="p-2">備註</th>
                        </tr>
                    </thead>
                    <tbody id="portalPayoutTable" class="divide-y">
                        <tr><td colspan="5" class="p-4 text-center text-gray-500">暫無紀錄</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // 【重要】請與管理員頁使用同一個 Apps Script 部署網址
        const GOOGLE_APP_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbysMf-bAyli08G9kqYNrMjEo9zLfP3rC5sHIDcPR6iDIaokJ9WQphWtbW1zB3bg0HG0/exec';

        // 載入成員名單（只顯示名稱，不含敏感設定）
        function loadMembers() {
            fetch(GOOGLE_APP_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: "getSettings" }) })
            .then(res => res.json()).then(res => {
                const sel = document.getElementById('portalMember');
                sel.innerHTML = '<option value="">請選擇...</option>';
                if (res.data) res.data.forEach(m => {
                    sel.innerHTML += `<option value="${m.name}">${m.name}</option>`;
                });
            }).catch(() => {});
        }

        function loginPortal() {
            const member = document.getElementById('portalMember').value;
            const pin = document.getElementById('portalPin').value;
            const err = document.getElementById('portalError');
            if (!member) {
                err.innerText = '請選擇成員';
                err.classList.remove('hidden');
                return;
            }
            err.classList.add('hidden');

            fetch(GOOGLE_APP_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "verifyMemberAccess", member: member, pin: pin })
            })
            .then(res => res.json()).then(res => {
                if (res.success) {
                    document.getElementById('loginBox').classList.add('hidden');
                    document.getElementById('portalContent').classList.remove('hidden');
                    document.getElementById('portalName').innerText = res.data.name;
                    document.getElementById('portalCapital').innerText = `$${Number(res.data.capital).toLocaleString()}`;
                    document.getElementById('portalEquity').innerText = `${Number(res.data.equityPercent).toFixed(2)}%`;
                    document.getElementById('portalCurrentValue').innerText = `$${Number(res.data.currentValue || 0).toLocaleString()}`;
                    document.getElementById('portalValueRule').innerText =
                        `本金 + 已派利息 $${Number(res.data.totalPaid || 0).toLocaleString()}　·　年化 ${res.data.interestRate}%`;

                    const tbody = document.getElementById('portalPayoutTable');
                    tbody.innerHTML = '';
                    if (res.data.payoutHistory && res.data.payoutHistory.length > 0) {
                        res.data.payoutHistory.forEach(row => {
                            tbody.innerHTML += `<tr>
                                <td class="p-2">${row.month}</td>
                                <td class="p-2 text-right">$${Number(row.suggested).toFixed(2)}</td>
                                <td class="p-2 text-right font-bold profit-green">$${Number(row.actual).toFixed(2)}</td>
                                <td class="p-2 text-right">${Number(row.rate).toFixed(2)}%</td>
                                <td class="p-2 text-gray-500">${row.memo || ''}</td>
                            </tr>`;
                        });
                    } else {
                        tbody.innerHTML = '<tr><td colspan="5" class="p-4 text-center text-gray-500">暫無派息紀錄</td></tr>';
                    }
                } else {
                    err.innerText = res.message || '登入失敗';
                    err.classList.remove('hidden');
                    document.getElementById('portalContent').classList.add('hidden');
                }
            }).catch(() => {
                err.innerText = '網路錯誤，請稍後再試';
                err.classList.remove('hidden');
            });
        }

        function logoutPortal() {
            document.getElementById('portalContent').classList.add('hidden');
            document.getElementById('loginBox').classList.remove('hidden');
            document.getElementById('portalPin').value = '';
            document.getElementById('portalError').classList.add('hidden');
        }

        // 支援 Enter 鍵登入
        document.getElementById('portalPin').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') loginPortal();
        });

        loadMembers();
    </script>
</body>
</html>
